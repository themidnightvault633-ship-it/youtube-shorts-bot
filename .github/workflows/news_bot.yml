name: 24/7 Real-Time Breaking News Engine (Nexora News)

on:
  schedule:
    # Har 30 minute me automatic scan karega
    - cron: '*/30 * * * *'
  workflow_dispatch: # Kabhi bhi man chahe 1-click me run karne ke liye

jobs:
  broadcast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: FedericoCarboni/setup-ffmpeg@v3
      - name: Install Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y fonts-dejavu-core fonts-liberation
          pip install -r requirements.txt
      - name: Scan & Broadcast Breaking News
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          python3 main.py --breaking-check --type both
