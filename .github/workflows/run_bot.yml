name: Run YouTube Short Generator

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick
          sudo sed -i 's/none/read,write/g' /etc/ImageMagick-6/policy.xml

      - name: Install Python Packages
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt || pip install -r $(find . -name "requirements.txt" | head -n 1)

      - name: Run Main Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # Automatically find where main.py is located and run it
          SCRIPT_PATH=$(find . -name "main.py" | head -n 1)
          if [ -z "$SCRIPT_PATH" ]; then
            echo "Error: main.py not found anywhere!"
            exit 1
          fi
          DIR_PATH=$(dirname "$SCRIPT_PATH")
          echo "Found main.py in $DIR_PATH. Running..."
          cd "$DIR_PATH"
          python main.py

      - name: Upload Generated Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: generated-short
          path: **/final_short.mp4
